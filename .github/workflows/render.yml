name: render-fact-video

on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: Unique tag for this render
        required: true
      title:
        required: true
      script:
        required: true
      scenes:
        description: Image prompts separated by |
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python packages
        run: pip install requests soundfile kokoro-onnx

      - name: Download voice model
        run: |
          curl -L -o kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -L -o voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Render video
        env:
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          TITLE: ${{ inputs.title }}
          SCRIPT: ${{ inputs.script }}
          SCENES: ${{ inputs.scenes }}
        run: python render.py

      - name: Publish as release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TAG: ${{ inputs.run_tag }}
        run: gh release create "$RUN_TAG" out.mp4 --title "$RUN_TAG" --notes "auto render"
